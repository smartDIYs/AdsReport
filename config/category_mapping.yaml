# カテゴリ自動分類パターン
# campaign_name または ad_group_name に対して正規表現マッチを行う
# マッチ順序: SCL → LC → LM → PL → SLW（SCLがLCに誤マッチしないよう先にチェック）
# 各パターンは「型番形式（SCL500 のように直後が数字）」と
# 「単独表記（G-Listing-SCL のように直後が区切り文字）」の両方を拾う
auto_patterns:
  SCL: "\\bSCL\\d|\\bSCL\\b"
  LC: "\\bFLC\\d|\\bLC\\d|\\bFLC\\b|\\bLC\\b"
  LM: "\\bLM\\d|\\bLM\\b"
  PL: "\\bPL\\d|\\bPL\\b"
  SLW: "\\bSLW\\d|\\bSLW\\b"

# 商品名→カテゴリマッピング（ショッピング広告の広告グループ名で判定）
# category.xlsx から生成
product_mapping:
  LM110F: "LM"
  LM110C: "LM"
  LM110U: "LM"
  LM100P: "LM"
  LM140R: "LM"
  LM110U3D: "LM"
  HL650: "LC"
  LC950: "LC"
  FLC1500: "LC"
  ELP: "LC"
  PL950: "PL"
  SCL2000CW: "SCL"
  SCL800CW: "SCL"
  SCL200: "SCL"
  SCL6000CW: "SCL"
  SCL500: "SCL"
  SLW2000: "SLW"
  SLW1500: "SLW"
  SLW700: "SLW"
  SLW-ROBOT: "SLW"

# 手動マッピング
# campaign_id をキーにしてカテゴリを直接指定する
# 自動分類より優先される
manual_mapping: {}
